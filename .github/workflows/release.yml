name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run package
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" block-ai-content-*.zip \
            --title "Block AI Content $GITHUB_REF_NAME" \
            --notes "Download **block-ai-content-${GITHUB_REF_NAME#v}.zip** below, then follow the [installation guide](https://github.com/${{ github.repository }}/blob/main/INSTALL.md)."
