name: Release
# Publishes a release whenever main carries a package.json version that hasn't
# been released yet. To ship: bump "version" in package.json and push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version already released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.v.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.v.outputs.skip != 'true'
        run: npm ci && npm run typecheck && npm test && npm run package
      - name: Publish release
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "v$VERSION" "block-ai-content-$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "Block AI Content v$VERSION" \
            --notes "Download **block-ai-content-$VERSION.zip** below, then follow the [installation guide](https://github.com/$GITHUB_REPOSITORY/blob/main/INSTALL.md)."
