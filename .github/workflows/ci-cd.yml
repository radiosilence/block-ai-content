name: CI/CD
# Every push and PR: lint, typecheck, unit tests, build and browser tests in one step.
# On main, if package.json carries a version with no release yet, publish one
# with the packaged extension attached. To ship: bump the version, push.
# Also on main: deploy the test page in site/ to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  # Safe on main too: a release only publishes versions that don't exist yet.
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3 # node + aube, as pinned in mise.toml
      - run: aube ci
      # No --with-deps: the runner image already ships Chrome and its system
      # libraries, and the extra apt packages (fonts) made runs crawl when
      # Ubuntu's mirror was slow. The browser itself is cached between runs.
      - id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium for browser tests
        run: aube exec playwright install chromium
        timeout-minutes: 5
      - name: Check (lint, typecheck, unit tests, build, browser tests)
        run: aube run check
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          if-no-files-found: ignore
      - run: aube run package
      - uses: actions/upload-artifact@v5
        with:
          name: extension
          path: block-ai-content-*.zip
          if-no-files-found: error

  release:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Work out version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v5
        if: steps.v.outputs.skip != 'true'
        with:
          name: extension
      - name: Publish release
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "v$VERSION" "block-ai-content-$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "Block AI Content v$VERSION" \
            --generate-notes \
            --notes "Download **block-ai-content-$VERSION.zip** below, then follow the [installation guide](https://github.com/$GITHUB_REPOSITORY/blob/main/INSTALL.md)."

  # The test page at https://radiosilence.github.io/block-ai-content/ (site/).
  # Needs Settings → Pages → Source: "GitHub Actions" enabled once.
  pages:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - run: node scripts/site.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
